name: Weekly GitHub Digest

on:
  schedule:
    # 毎週月曜 8:50 JST（= 日曜 23:50 UTC）。9:00 頃にレポートが揃う
    # 毎時 0 分は GitHub 側が混雑して遅延・取りこぼしが起きやすいので避けている
    - cron: "50 23 * * 0"
  workflow_dispatch: # 管理画面や Actions タブから手動実行
    inputs: # 空欄なら config/themes.json の値を使う（特別実行用）
      days:
        description: "対象期間（日）。例: 365"
        required: false
        default: ""
      themed_count:
        description: "テーマありの件数（0〜30）"
        required: false
        default: ""
      general_count:
        description: "テーマなしの件数（0〜30）"
        required: false
        default: ""
      label:
        description: "出力フォルダ名の末尾（例: special）。空欄なら日付のみ"
        required: false
        default: ""
      themes:
        description: "テーマをカンマ区切りで上書き（例: RAG,GraphRAG）。上書きがあると設定1をベースに1冊だけ作る"
        required: false
        default: ""
      balanced:
        description: "テーマごとに均等に選ぶ"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 日本語フォントと PDF 用ライブラリを入れる
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - run: pip install -r requirements.txt

      - name: レポートを作成
        run: |
          args=(--out reports --prune-days 14) # 直近 2 週間分のフォルダだけ残す
          [ -n "$THEMES" ] && args+=(--themes "$THEMES")
          [ "$BALANCED" = "true" ] && args+=(--balanced)
          [ -n "$DAYS" ] && args+=(--days "$DAYS")
          [ -n "$THEMED_COUNT" ] && args+=(--themed-count "$THEMED_COUNT")
          [ -n "$GENERAL_COUNT" ] && args+=(--general-count "$GENERAL_COUNT")
          [ -n "$LABEL" ] && args+=(--label "$LABEL")
          python -m digest "${args[@]}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ inputs.days }}
          THEMED_COUNT: ${{ inputs.themed_count }}
          GENERAL_COUNT: ${{ inputs.general_count }}
          LABEL: ${{ inputs.label }}
          THEMES: ${{ inputs.themes }}
          BALANCED: ${{ inputs.balanced }}

      - name: レポートをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports # 新しいレポートの追加と、古いフォルダの削除の両方
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "レポート追加: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git pull --rebase
          git push
